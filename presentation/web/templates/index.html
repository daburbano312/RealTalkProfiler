<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealTalk Profiler</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <a href="{{ url_for('index') }}" class="logo-link">
                     <h1 class="logo">
                         <i class="fas fa-headset"></i> <span>RealTalk Profiler</span>
                     </h1>
                </a>
            </div>
            <nav class="menu">
                <a href="{{ url_for('index') }}" class="menu-item {% if request.endpoint == 'index' %}active{% endif %}" id="dashboardLink">
                    <i class="fas fa-tachometer-alt fa-fw"></i> <span class="menu-text">Dashboard</span>
                </a>
                <a href="{{ url_for('proyectos') }}" class="menu-item {% if request.endpoint == 'proyectos' %}active{% endif %}" id="projectsLink">
                    <i class="fas fa-building fa-fw"></i> <span class="menu-text">Proyectos</span>
                </a>
                <a href="{{ url_for('historial') }}" class="menu-item {% if request.endpoint == 'historial' %}active{% endif %}" id="historyLink">
                    <i class="fas fa-history fa-fw"></i> <span class="menu-text">Historial de Llamadas</span>
                </a>
            </nav>

            <!-- Logout Section -->
            <div class="user-info" style="padding: 10px; color: #eee; text-align: center;">
                <p>Hola, {{ current_user.email }}</p>
                <a href="{{ url_for('logout') }}" class="menu-item" style="color: #ffc107; text-decoration: none;">
                    <i class="fas fa-sign-out-alt fa-fw"></i> <span class="menu-text">Cerrar Sesión</span>
                </a>
            </div>
        </div>

        <div class="content">
            <div class="header">
                <div class="title">🧠 Transcripción en vivo</div>
            </div>

            <div id="status" class="status-indicator">Conectando al servidor...</div>
            <div class="controls">
                <button id="btnStart" class="btn btn-start" disabled><i class="fas fa-play"></i> Iniciar Grabación</button>
                <button id="btnStop" class="btn btn-stop" disabled><i class="fas fa-stop"></i> Detener Grabación</button>
            </div>

            <div id="frequencyAnimation" class="frequency-animation">
                <div class="bar"></div> <div class="bar"></div> <div class="bar"></div>
                <div class="bar"></div> <div class="bar"></div> <div class="bar"></div>
                <div class="bar"></div> <div class="bar"></div>
            </div>

            <div id="resultsPanel" class="results-panel">
                <div class="resultCard">
                    <div class="icon-container"><i class="fas fa-microphone"></i></div>
                    <h3>Transcripción</h3>
                    <p id="output" class="output-placeholder">Esperando inicio de grabación...</p>
                </div>
                <div class="resultCard">
                    <div class="icon-container"><i class="fas fa-smile"></i></div>
                    <h3>Emoción Detectada</h3>
                    <p id="emotionOutput" class="output-placeholder">...</p>
                    <small id="emotionDetails"></small>
                </div>
                <div class="resultCard">
                    <div class="icon-container"><i class="fas fa-key"></i></div>
                    <h3>Palabras Clave</h3>
                    <p id="keywordsOutput" class="output-placeholder">...</p>
                </div>
                <div class="resultCard full-width-card">
                    <div class="icon-container"><i class="fas fa-bullhorn"></i></div>
                    <h3>Recomendación</h3>
                    <p id="suggestionOutput" class="output-placeholder">...</p>
                    <div id="suggestionSpinner" class="spinner" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
