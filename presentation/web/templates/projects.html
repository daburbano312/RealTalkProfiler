<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos Inmobiliarios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<div class="main-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="{{ url_for('index') }}" class="logo-link">
                 <h1 class="logo">
                     <i class="fas fa-headset"></i> <span>RealTalk Profiler</span>
                 </h1>
            </a>
        </div>
        <nav class="menu">
            <a href="{{ url_for('index') }}" class="menu-item {% if request.endpoint == 'index' %}active{% endif %}" id="dashboardLink">
                <i class="fas fa-tachometer-alt fa-fw"></i> <span class="menu-text">Dashboard</span>
            </a>
            <a href="{{ url_for('proyectos') }}" class="menu-item {% if request.endpoint == 'proyectos' %}active{% endif %}" id="projectsLink">
                <i class="fas fa-building fa-fw"></i> <span class="menu-text">Proyectos</span>
            </a>
        </nav>

        <!-- Logout Section -->
        <div class="user-info" style="padding: 10px; color: #eee; text-align: center;">
            <p>Hola, {{ current_user.email }}</p>
            <a href="{{ url_for('logout') }}" class="menu-item" style="color: #ffc107; text-decoration: none;">
                <i class="fas fa-sign-out-alt fa-fw"></i> <span class="menu-text">Cerrar Sesión</span>
            </a>
        </div>
    </div>

    <div class="content">
        <h1>Proyectos Inmobiliarios Disponibles</h1>

        <div class="filter-bar">
            <label for="min-price">Precio Mínimo (COP):</label>
            <input type="number" id="min-price" placeholder="Ej: 300000000" min="0" step="10000000"/>

            <label for="max-price">Precio Máximo (COP):</label>
            <input type="number" id="max-price" placeholder="Ej: 900000000" min="0" step="10000000"/>
            <button id="filter-btn" class="btn btn-filter"><i class="fas fa-filter"></i> Filtrar</button>
            <button id="reset-btn" class="btn btn-secondary"><i class="fas fa-undo"></i> Limpiar</button>
        </div>

        <div id="projects-list" class="projects-container">
            <p class="loading-message">Cargando proyectos...</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const projectsListDiv = document.getElementById('projects-list');
        const filterBtn = document.getElementById('filter-btn');
        const resetBtn = document.getElementById('reset-btn');
        const minPriceInput = document.getElementById('min-price');
        const maxPriceInput = document.getElementById('max-price');

        // --- Función para mostrar los proyectos en tarjetas ---
        function displayProjects(projectsData) {
            projectsListDiv.innerHTML = '';

            if (!Array.isArray(projectsData) || projectsData.length === 0) {
                projectsListDiv.innerHTML = '<p class="info-message">No se encontraron proyectos con los criterios seleccionados.</p>';
                return;
            }

            projectsData.forEach(project => {
                const projectCard = document.createElement('div');
                projectCard.classList.add('project-card');
                const formattedPrice = typeof project.precio === 'number' ? `COP ${project.precio.toLocaleString('es-CO')}` : project.precio;
                projectCard.innerHTML = `
                    <div class="project-card-header">
                        <h3>${project.nombre || 'Sin nombre'}</h3>
                        <div class="price">${formattedPrice}</div>
                    </div>
                    <p class="description">${project.descripcion || 'Sin descripción.'}</p>
                    <div class="location"><i class="fas fa-map-marker-alt"></i> ${project.ubicacion || 'Ubicación no especificada'}</div>
                    <div class="card-actions">
                        <button class="btn btn-details" data-project-id="${project.id}">Ver detalles</button>
                    </div>
                `;
                projectsListDiv.appendChild(projectCard);
            });
        }

        async function fetchProjects(params = {}) {
            projectsListDiv.innerHTML = '<p class="loading-message">Buscando proyectos...</p>';
            const url = new URL('/api/proyectos', window.location.origin);
            Object.keys(params).forEach(key => {
                if (params[key] !== null && params[key] !== undefined && params[key] !== '') {
                    url.searchParams.append(key, params[key]);
                }
            });

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    let errorMsg = `Error al cargar proyectos: ${response.statusText}`;
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData.error || errorData.message || errorMsg;
                    } catch (e) {}
                    throw new Error(errorMsg);
                }
                const data = await response.json();
                displayProjects(data);
            } catch (error) {
                console.error("Error fetching projects:", error);
                projectsListDiv.innerHTML = `<p class="error-message">Error al cargar proyectos: ${error.message}. Intenta de nuevo más tarde.</p>`;
            }
        }

        filterBtn.addEventListener('click', () => {
            const filters = {
                min_price: minPriceInput.value || null,
                max_price: maxPriceInput.value || null,
            };
            fetchProjects(filters);
        });

        resetBtn.addEventListener('click', () => {
            minPriceInput.value = '';
            maxPriceInput.value = '';
            fetchProjects();
        });

        fetchProjects();
    });
</script>

</body>
</html>
